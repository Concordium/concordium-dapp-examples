[package]
name = "track-and-trace"
version = "0.1.0"
authors = ["Concordium <developers@concordium.com>"]
edition = "2021"
license = "MPL-2.0"
description = "A smart contract for tracking and tracing items on a supply chain."

[dependencies]
track-and-trace-common = { path = "../common" }
concordium-std = { version = "11.0.0" }
concordium-cis2 = { version = "7.0.1" }

[dev-dependencies]
concordium-smart-contract-testing = { version = "5.0.0" }
rand = "0.8"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
opt-level = "s"
